# Second Payment instance profile
spring.application.name=PAYMENT
server.port=${PAYMENT_PORT:8088}
# Override EUREKA_SERVERS with all Eureka URLs if the second server is available.
eureka.client.service-url.defaultZone=${EUREKA_SERVERS:http://172.20.10.3:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
spring.datasource.url=jdbc:h2:file:./data/autohub_payment;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
