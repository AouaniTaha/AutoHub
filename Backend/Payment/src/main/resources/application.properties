# APPLICATION
spring.application.name=PAYMENT
server.port=8087

# EUREKA CLIENT
eureka.client.service-url.defaultZone=http://172.20.10.3:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=always

# DATABASE (in-memory; data is reset when the service stops)
spring.datasource.url=jdbc:h2:mem:autohub_payment;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

info.app.name=AutoHub Payment Service
info.app.version=1.0.0
