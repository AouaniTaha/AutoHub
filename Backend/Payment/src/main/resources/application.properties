# APPLICATION
spring.application.name=PAYMENT
server.port=${PAYMENT_PORT:8087}

# EUREKA CLIENT
# EUREKA_SERVERS can contain multiple Eureka URLs separated by commas.
eureka.client.service-url.defaultZone=${EUREKA_SERVERS:http://172.20.10.3:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=always

# DATABASE shared by both Payment instances
spring.datasource.url=jdbc:h2:file:./data/autohub_payment;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

info.app.name=AutoHub Payment Service
info.app.version=1.0.0
