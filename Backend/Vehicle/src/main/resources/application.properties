# APPLICATION
spring.application.name=VEHICLE
server.port=8082

# EUREKA CLIENT
eureka.client.service-url.defaultZone=http://172.20.10.3:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings
management.endpoint.health.show-details=always

info.app.name=AutoHub Vehicle Service
info.app.version=1.0.0
