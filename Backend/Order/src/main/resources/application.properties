# ==========================================
# APPLICATION
# ==========================================
spring.application.name=ORDER
server.port=8086

# ==========================================
# DATABASE (H2 par defaut pour portabilite)
# Pour PostgreSQL : lancer avec --spring.profiles.active=postgres
# ==========================================
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# EUREKA CLIENT (supporte 2 instances Eureka : 8761 & 8762)
# ==========================================
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka,http://localhost:8762/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# ==========================================
# SPRING BOOT ACTUATOR (OBSERVABILITE)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env,loggers,threaddump
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=AutoHub Order Service
info.app.description=Microservice de gestion des paniers et commandes (AutoHub)
info.app.version=1.0.0
